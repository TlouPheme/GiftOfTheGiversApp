# Gift of the Givers pipeline.
# Stage 1 builds the solution and runs the unit and integration tests on every commit.
# Stage 2 (deployment) is added by the deployment lead below this stage.

trigger:
  branches:
    include:
    - main
    - tests/*

stages:
- stage: BuildAndTest
  displayName: Build and test
  jobs:
  - job: Build
    pool:
      vmImage: windows-latest

    steps:
    - task: UseDotNet@2
      displayName: Install .NET 8
      inputs:
        packageType: sdk
        version: 8.0.x

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '**/*.sln'
        feedsToUse: select
        vstsFeed: '9b88a48d-092a-4829-858d-b77799a019d6/giftofthegivers'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '**/*.sln'
        arguments: --configuration Release --no-restore

    - task: DotNetCoreCLI@2
      displayName: Unit tests
      inputs:
        command: test
        projects: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
        arguments: >-
          --configuration Release --no-build
          --filter "Category!=Integration"
          --collect "XPlat Code Coverage"
          --settings GiftOfTheGivers.Tests/coverlet.runsettings
        publishTestResults: true
        testRunTitle: Unit tests

    - task: DotNetCoreCLI@2
      displayName: Integration tests
      inputs:
        command: test
        projects: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
        arguments: >-
          --configuration Release --no-build
          --filter "Category=Integration"
          --collect "XPlat Code Coverage"
          --settings GiftOfTheGivers.Tests/coverlet.runsettings
        publishTestResults: true
        testRunTitle: Integration tests

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
